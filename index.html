<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Live Phone Bridge</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 max-w-lg mx-auto space-y-4">

  <header class="border-b border-slate-800 pb-3 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold text-white">Gemini Live Phone Bridge</h1>
      <p id="statusSubtitle" class="text-xs text-slate-400">On-Device Echo-Gated Audio</p>
    </div>
    <span id="callTimer" class="font-mono text-xs bg-slate-800 text-emerald-400 px-2.5 py-1 rounded-full border border-slate-700">00:00</span>
  </header>

  <!-- Controls Card -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Gemini API Key</label>
      <input id="apiKeyInput" type="password" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white font-mono focus:border-emerald-500" />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Friend's Phone Number</label>
      <input id="phoneInput" type="tel" value="+1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-base text-white font-mono focus:border-emerald-500" />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Gemini Voice</label>
      <select id="voiceSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
        <option value="Puck">Puck</option>
        <option value="Charon">Charon</option>
        <option value="Kore">Kore</option>
        <option value="Fenrir">Fenrir</option>
        <option value="Aoede">Aoede</option>
      </select>
    </div>

    <div class="pt-2 flex flex-col gap-2">
      <button id="btnBridge" type="button" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm transition shadow-lg">
        1. Start Gemini Live Bridge
      </button>
      <a id="linkDial" href="tel:+1" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm text-center transition shadow-lg">
        2. Dial in Phone / Google Voice
      </a>
    </div>

    <div class="flex gap-2 pt-2">
      <button id="btnMute" type="button" class="flex-1 py-2 bg-slate-800 text-xs rounded-xl font-semibold text-slate-300">
