<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Live Phone Bridge</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 max-w-lg mx-auto space-y-4">

  <header class="border-b border-slate-800 pb-3 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold text-white">Gemini Live Phone Bridge</h1>
      <p id="statusSubtitle" class="text-xs text-slate-400">On-Device Echo-Gated Audio</p>
    </div>
    <span id="callTimer" class="font-mono text-xs bg-slate-800 text-emerald-400 px-2.5 py-1 rounded-full border border-slate-700">00:00</span>
  </header>

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Gemini API Key</label>
      <input id="apiKeyInput" type="password" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white font-mono" />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Friend's Phone Number</label>
      <input id="phoneInput" type="tel" value="+1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-base text-white font-mono" />
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Gemini Voice</label>
      <select id="voiceSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
        <option value="Puck">Puck</option>
        <option value="Charon">Charon</option>
        <option value="Kore">Kore</option>
        <option value="Fenrir">Fenrir</option>
        <option value="Aoede">Aoede</option>
      </select>
    </div>

    <div class="pt-2 flex flex-col gap-2">
      <button id="btnBridge" type="button" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm transition shadow-lg">
        1. Start Gemini Live Bridge
      </button>
      <a id="linkDial" href="tel:+1" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm text-center transition shadow-lg">
        2. Dial in Phone / Google Voice
      </a>
    </div>

    <div class="flex gap-2 pt-2">
      <button id="btnMute" type="button" class="flex-1 py-2 bg-slate-800 text-xs rounded-xl font-semibold text-slate-300">Mic: Active</button>
      <button id="btnInterrupt" type="button" class="flex-1 py-2 bg-amber-600/20 text-amber-300 border border-amber-500/30 text-xs rounded-xl font-semibold">Interrupt AI</button>
    </div>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
    <div class="text-xs font-semibold uppercase text-slate-400">Activity Log</div>
    <div id="logBox" class="h-44 overflow-y-auto bg-slate-950 rounded-xl p-3 font-mono text-xs space-y-1 text-slate-300 border border-slate-800"></div>
  </div>

  <script>
    var isRunning = false, isSetupComplete = false, isMuted = false;
    var ws = null, audioCtx = null, mediaStream = null, scriptProc = null;
    var nextPlayTime = 0, geminiSpeakingUntilMs = 0, activeSources = [], timerId = null, startTime = 0;

    var apiKeyInput = document.getElementById('apiKeyInput');
    var phoneInput = document.getElementById('phoneInput');
    var voiceSelect = document.getElementById('voiceSelect');
    var btnBridge = document.getElementById('btnBridge');
    var linkDial = document.getElementById('linkDial');
    var btnMute = document.getElementById('btnMute');
    var btnInterrupt = document.getElementById('btnInterrupt');
    var logBox = document.getElementById('logBox');
    var callTimer = document.getElementById('callTimer');

    function log(msg, type) {
      var div = document.createElement('div');
      div.className = type === 'success' ? 'text-emerald-400' : (type === 'error' ? 'text-rose-400' : 'text-slate-300');
      div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      logBox.insertBefore(div, logBox.firstChild);
    }

    phoneInput.addEventListener('input', function() {
      linkDial.href = 'tel:' + phoneInput.value.trim();
    });

    btnInterrupt.addEventListener('click', function() {
      activeSources.forEach(function(s) { try { s.stop(); } catch(e){} });
      activeSources = [];
      if (audioCtx) nextPlayTime = audioCtx.currentTime;
      geminiSpeakingUntilMs = 0;
      log('Interrupted Gemini audio playback.');
    });

    btnMute.addEventListener('click', function() {
      isMuted = !isMuted;
      btnMute.textContent = isMuted ? 'Mic: Muted' : 'Mic: Active';
      btnMute.className = isMuted ? 'flex-1 py-2 bg-rose-600/30 text-rose-300 border border-rose-500/40 text-xs rounded-xl font-semibold' : 'flex-1 py-2 bg-slate-800 text-xs rounded-xl font-semibold text-slate-300';
    });

    function playPcm24k(b64) {
      if (!audioCtx) return;
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var int16 = new Int16Array(bytes.buffer);
      var float32 = new Float32Array(int16.length);
      for (var j = 0; j < int16.length; j++) float32[j] = int16[j] / 32768.0;

      var buf = audioCtx.createBuffer(1, float32.length, 24000);
      buf.getChannelData(0).set(float32);
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);

      var now = audioCtx.currentTime;
      if (nextPlayTime < now) nextPlayTime = now;
      src.start(nextPlayTime);
      nextPlayTime += buf.duration;
      activeSources.push(src);

      // Smart Echo Gate: Mutes mic while Gemini is playing through the speaker
      geminiSpeakingUntilMs = Date.now() + ((nextPlayTime - audioCtx.currentTime) * 1000) + 280;
    }

    btnBridge.addEventListener('click', async function() {
      if (isRunning) {
        stopBridge();
        return;
      }
      var key = apiKeyInput.value.trim();
      if (!key) { alert('Please enter your Gemini API Key first.'); return; }

      try {
        log('Requesting microphone access...');
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        nextPlayTime = audioCtx.currentTime;
        var source = audioCtx.createMediaStreamSource(mediaStream);
        scriptProc = audioCtx.createScriptProcessor(4096, 1, 1);
        source.connect(scriptProc);
        scriptProc.connect(audioCtx.destination);

        isSetupComplete = false;
        var wsUrl = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=' + encodeURIComponent(key);
        ws = new WebSocket(wsUrl);

        ws.onopen = function() {
          log('Connected to Gemini WebSocket. Sending setup config...', 'info');
          ws.send(JSON.stringify({
            setup: {
              model: 'models/gemini-2.0-flash-exp',
              generationConfig: {
                responseModalities: ['AUDIO'],
                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceSelect.value } } }
              },
              systemInstruction: {
                parts: [{ text: 'You are an AI assistant answering a live phone call with my friend. Keep responses brief, conversational, and natural for telephone speech.' }]
              }
            }
          }));
        };

        ws.onmessage = async function(e) {
          var raw = e.data instanceof Blob ? await e.data.text() : e.data;
          var json = JSON.parse(raw);

          // 1. Wait for setupComplete before transmitting mic audio
          if (json.setupComplete) {
            isSetupComplete = true;
            log('Gemini Live session configured & ready! Listening for speech...', 'success');
            return;
          }

          if (json.serverContent && json.serverContent.interrupted) {
            btnInterrupt.click();
            return;
          }
          if (json.serverContent && json.serverContent.modelTurn && json.serverContent.modelTurn.parts) {
            json.serverContent.modelTurn.parts.forEach(function(p) {
              if (p.inlineData && p.inlineData.mimeType && p.inlineData.mimeType.indexOf('audio') !== -1) {
                playPcm24k(p.inlineData.data);
              }
            });
          }
        };

        ws.onclose = function(e) {
          var hint = '';
          if (e.code === 1008) hint = ' (Policy violation: Check API Key or Model access)';
          if (e.code === 1006) hint = ' (Connection failed: Check internet / API key)';
          log('WebSocket closed [Code ' + e.code + (e.reason ? ' - ' + e.reason : '') + ']' + hint, 'error');
          if (isRunning) stopBridge();
        };

        scriptProc.onaudioprocess = function(e) {
          // Do not send mic data until Gemini setupComplete is confirmed
          if (!isRunning || !isSetupComplete || isMuted || !ws || ws.readyState !== WebSocket.OPEN) return;
          if (Date.now() < geminiSpeakingUntilMs) return;

          var inp = e.inputBuffer.getChannelData(0);
          var ratio = audioCtx.sampleRate / 16000;
          var newLen = Math.round(inp.length / ratio);
          var down = new Float32Array(newLen);
          for (var i = 0; i < newLen; i++) down[i] = inp[Math.round(i * ratio)] || 0;

          var pcmBuf = new ArrayBuffer(down.length * 2);
          var view = new DataView(pcmBuf);
          for (var j = 0; j < down.length; j++) {
            var s = Math.max(-1, Math.min(1, down[j]));
            view.setInt16(j * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
          }
          var bin = '';
          var u8 = new Uint8Array(pcmBuf);
          for (var k = 0; k < u8.length; k++) bin += String.fromCharCode(u8[k]);
          ws.send(JSON.stringify({
            realtimeInput: { mediaChunks: [{ mimeType: 'audio/pcm;rate=16000', data: btoa(bin) }] }
          }));
        };

        isRunning = true;
        btnBridge.textContent = 'Stop Gemini Bridge';
        btnBridge.className = 'w-full py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-sm transition';
        startTime = Date.now();
        timerId = setInterval(function() {
          var diff = Math.floor((Date.now() - startTime) / 1000);
          callTimer.textContent = String(Math.floor(diff / 60)).padStart(2, '0') + ':' + String(diff % 60).padStart(2, '0');
        }, 1000);

      } catch (err) {
        log('Error: ' + err.message, 'error');
      }
    });

    function stopBridge() {
      isRunning = false;
      isSetupComplete = false;
      clearInterval(timerId);
      if (scriptProc) { try { scriptProc.disconnect(); } catch(e){} }
      if (mediaStream) { mediaStream.getTracks().forEach(function(t) { t.stop(); }); }
      if (audioCtx) { try { audioCtx.close(); } catch(e){} }
      if (ws) { try { ws.close(); } catch(e){} }
      btnBridge.textContent = '1. Start Gemini Live Bridge';
      btnBridge.className = 'w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm transition shadow-lg';
      log('Bridge stopped.');
    }
  </script>
</body>
</html>
